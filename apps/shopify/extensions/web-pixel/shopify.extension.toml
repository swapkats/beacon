type = "web_pixel_extension"
name = "beacon-pixel"
runtime_context = "strict"

[customer_privacy]
analytics = true
marketing = false
preferences = false
sale_of_data = "disabled"

[settings]
type = "object"

[settings.fields.ingestUrl]
name = "Ingest URL"
description = "Beacon ingest endpoint URL"
type = "single_line_text_field"

[settings.fields.storeToken]
name = "Store token"
description = "Beacon store ingest token"
type = "single_line_text_field"
